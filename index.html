<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackLogic Construction Studio</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{
  height:100vh;
  background:url('site.png') no-repeat center center/cover;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* Dark overlay */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
  z-index:-1;
}

/* Banner */
.banner{
  height:300px;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
}

.banner-content{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.banner-img{
  max-width:500px;
  width:90%;
  border-radius:25px;  
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.banner button{
  padding:12px 30px;
  border:none;
  background:#00c896;
  color:white;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
  transition:0.3s ease;
}

.banner button:hover{
  background:#00a87d;
  transform:scale(1.05);
}

/* Access Form */
.access-form{
  display:none;
  margin:auto;
  background:rgba(255,255,255,0.1);
  padding:30px;
  border-radius:10px;
  backdrop-filter: blur(15px);
  text-align:center;
}

.access-form input{
  width:200px;
  padding:10px;
  margin-bottom:15px;
  border:none;
  border-radius:5px;
}

.access-form button{
  padding:10px 20px;
  border:none;
  background:#ff6a00;
  color:white;
  cursor:pointer;
  border-radius:8px;
  position:relative;
  overflow:hidden;
  font-weight:bold;
}

.loading{
  opacity:0.6;
  pointer-events:none;
}

/* Spinner */
#spinner{
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:20px;
  height:20px;
  border:3px solid rgba(255,255,255,0.3);
  border-top:3px solid white;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

#loginBtn{
  display:none;
  margin-top:15px;
  padding:10px 25px;
  border:none;
  background:#28a745;
  color:white;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

@keyframes spin {
  0% { transform: translate(-50%,-50%) rotate(0deg); }
  100% { transform: translate(-50%,-50%) rotate(360deg); }
}
</style>
</head>

<body>

<div class="banner">
  <div class="banner-content">
    <img src="conc.png" alt="Construction Studio Banner" class="banner-img">
    <button onclick="showForm()">Get Started</button>
  </div>
</div>

<div class="access-form" id="formSection">
  <h2 style="color:white; margin-bottom:15px;">Gain Access</h2>
  <input type="text" id="username" placeholder="Username">
  <button id="accessBtn" onclick="validateAccess()">
    Gain Access
    <div id="spinner"></div>
  </button>
  <button id="loginBtn" onclick="goToDashboard()">Login</button>
</div>

<script>
const allowedUsers = ["KX1011", "KX0011"];

function showForm(){
  const form = document.getElementById("formSection");
  form.style.display = "block";
  form.scrollIntoView({behavior:"smooth"});
}

function validateAccess(){
  const username = document.getElementById("username").value.trim().toUpperCase();
  const btn = document.getElementById("accessBtn");
  const spinner = document.getElementById("spinner");
  const loginBtn = document.getElementById("loginBtn");

  if(!allowedUsers.includes(username)){
    alert("Access Denied 💻⛔️");
    return;
  }

  // Show spinner & disable button
  btn.disabled = true;
  btn.classList.add("loading");
  spinner.style.display = "block";
  btn.innerText = "";

  // simulate loading
  setTimeout(()=>{
    spinner.style.display = "none";
    btn.innerText = "Access Granted 💻✅";
    btn.style.background="#28a745";
    btn.classList.remove("loading");

    // Show manual Login button
    loginBtn.style.display = "inline-block";

  },1500);
}

function goToDashboard(){
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
