<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Closure | BlackLogic Construction</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --primary:#ff6a00;
}
*{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif;}
body{background:#0d0d0d; color:white;}
.banner{height:200px; width:100%; background:url('site.png') center/cover no-repeat; display:flex; align-items:center; justify-content:center; box-shadow:0 0 20px rgba(255,106,0,0.6);}
.banner h1{background:rgba(0,0,0,0.7); padding:20px 40px; border-radius:15px;}
.container{padding:20px 30px;}
.section{margin-bottom:40px; padding:25px; background:#1a1a1a; border-radius:15px; border:1px solid rgba(255,106,0,0.3);}
.section h2{margin-bottom:20px; color:var(--primary);}
.form-group{margin-bottom:15px;}
.form-group label{display:block; margin-bottom:5px; font-weight:bold; color:var(--primary);}
.form-group input,.form-group select,.form-group textarea{width:100%; padding:10px; border-radius:8px; border:none; background:#111; color:white; border:1px solid #333;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border:1px solid var(--primary); outline:none;}
button{padding:10px 20px; border:none; border-radius:8px; cursor:pointer; background:var(--primary); color:white; margin-top:10px;}
.status-buttons{display:flex; gap:10px; margin-top:5px;}
.status-buttons button{flex:1; background:#222; border:1px solid #444;}
.status-active{background:#28a745 !important;}
.receipt{background:white; color:black; padding:20px; margin-top:15px; border-radius:10px; font-family:monospace;}
.download-btn{background:#111; color:white; margin-top:10px;}
</style>
</head>
<body>

<div class="banner"><h1>Project Closure</h1></div>

<div class="container">
<div class="section">
<h2>Project Closure Form</h2>

<div class="form-group">
  <label>Authority</label>
  <select id="crole">
    <option value="">Select Role</option>
    <option value="Project Manager">Project Manager</option>
    <option value="Civil Engineering">Civil Engineering</option>
    <option value="Construction Technologist">Construction Technologist</option>
  </select>
</div>

<div class="form-group">
  <label>Initials and Surname</label>
  <input type="text" id="cinitials" placeholder="e.g. J.S. Mathebula">
</div>

<div class="form-group">
  <label>Company Name</label>
  <input type="text" id="ccompany">
</div>

<div class="form-group">
  <label>CIPC Number</label>
  <input type="text" id="ccipc">
</div>

<div class="form-group">
  <label>Project Name</label>
  <input type="text" id="cproject">
</div>

<div class="form-group">
  <label>Budget (ZAR)</label>
  <input type="number" id="cbudget" placeholder="R0.00" step="0.01">
</div>

<div class="form-group">
  <label>Start Date</label>
  <input type="date" id="cstart">
</div>

<div class="form-group">
  <label>End Date</label>
  <input type="date" id="cend">
</div>

<div class="form-group">
  <label>Expected Deadline</label>
  <input type="date" id="cexpected">
</div>

<div class="form-group">
  <label>Final Comment</label>
  <textarea id="ccomment" placeholder="Write final remarks about project closure..."></textarea>
</div>

<!-- Closure Status -->
<div class="form-group">
  <label>Closure Status</label>
  <div class="status-buttons">
    <button type="button" onclick="setClosureStatus(this,'✅ Completed')">✅ Completed</button>
    <button type="button" onclick="setClosureStatus(this,'⚠️ Pending')">⚠️ Pending</button>
    <button type="button" onclick="setClosureStatus(this,'❌ Issues')">❌ Issues</button>
  </div>
</div>

<button onclick="generateClosureReceipt()">Submit</button>
<div id="closureReceipt"></div>
</div>
</div>

<script>
let mustDownload = false;
let closureStatus = "";

function setClosureStatus(btn, status){
  document.querySelectorAll(".status-buttons button").forEach(b=>b.classList.remove("status-active"));
  btn.classList.add("status-active");
  closureStatus = status;
}

function downloadReceipt(content){
  const blob = new Blob([content], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "closure_receipt.html";
  a.click();
  mustDownload = false;
}

window.onbeforeunload = function(){
  if(mustDownload){
    return "Admin must download receipt before leaving.";
  }
};

function generateClosureReceipt(){
  if(!crole.value){ alert("Select your role."); return; }
  if(!cinitials.value){ alert("Enter initials and surname."); return; }
  if(!closureStatus){ alert("Select closure status."); return; }

  let conclusion = "";
  if(closureStatus.includes("Completed")){
    conclusion = "Project successfully closed. All objectives met.";
  } else if(closureStatus.includes("Pending")){
    conclusion = "Project closure pending. Some tasks still need attention.";
  } else if(closureStatus.includes("Issues")){
    conclusion = "Project closure has issues. Immediate action required.";
  }

  // Include Budget formatted
  let budgetText = cbudget.value ? `R${parseFloat(cbudget.value).toLocaleString('en-ZA', {minimumFractionDigits:2})}` : "R0.00";

  const receiptContent = `
  <div class='receipt'>
    <h3>PROJECT CLOSURE RECEIPT</h3><br>
    Authority: ${crole.value}<br>
    Name: ${cinitials.value}<br><br>
    Company: ${ccompany.value}<br>
    CIPC Number: ${ccipc.value}<br>
    Project: ${cproject.value}<br>
    Budget: ${budgetText}<br>
    Start Date: ${cstart.value}<br>
    End Date: ${cend.value}<br>
    Expected Deadline: ${cexpected.value}<br><br>
    Final Comment:<br>${ccomment.value}<br><br>
    Closure Status: ${closureStatus}<br>
    <strong>Conclusion:</strong> ${conclusion}
  </div>`;

  // Set receipt in DOM
  const closureDiv = document.getElementById("closureReceipt");
  closureDiv.innerHTML = "";
  const div = document.createElement("div");
  div.innerHTML = receiptContent;
  const btn = document.createElement("button");
  btn.className = "download-btn";
  btn.innerHTML = '<i class="fas fa-download"></i> Download';
  btn.onclick = () => downloadReceipt(receiptContent);
  div.appendChild(btn);
  closureDiv.appendChild(div);

  // Lock form
  document.querySelectorAll(".section")[0].querySelectorAll("input, select, textarea, button")
  .forEach(el=>{ if(!el.classList.contains("download-btn")) el.disabled=true; });

  mustDownload = true;
}
</script>
</body>
</html>
